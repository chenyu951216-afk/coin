name: manual-real-data-backtest

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Bitget USDT perpetual symbol, e.g. ETHUSDT, BTCUSDT, SOLUSDT'
        required: true
        default: 'ETHUSDT'
      start:
        description: 'Optional UTC start. Leave blank to use the maximum safe CoinGlass Standard range.'
        required: false
        default: ''
      end:
        description: 'Optional UTC end. Leave blank to use the latest completed candle.'
        required: false
        default: ''
      timeframe:
        description: 'CoinGlass/strategy timeframe: 5m,15m,30m,1h,4h...'
        required: true
        default: '15m'
      coinglass_exchange:
        description: 'CoinGlass derivatives source exchange'
        required: true
        default: 'Bitget'
      risk_per_trade:
        description: 'Equity risk fraction per trade'
        required: true
        default: '0.01'
      taker_fee_bps:
        description: 'Your actual taker fee in basis points per fill'
        required: true
        default: '6'
      slippage_bps:
        description: 'Assumed adverse slippage per fill in basis points'
        required: true
        default: '2'
      min_aligned_coverage:
        description: 'Abort below this source alignment coverage'
        required: true
        default: '0.90'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
      COINGLASS_EXCHANGE: ${{ inputs.coinglass_exchange }}
      COINGLASS_SYMBOL: AUTO
      SYMBOL: ${{ inputs.symbol }}
      TIMEFRAME: ${{ inputs.timeframe }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
      INITIAL_EQUITY: '10000'
      RISK_PER_TRADE: ${{ inputs.risk_per_trade }}
      TAKER_FEE_BPS: ${{ inputs.taker_fee_bps }}
      SLIPPAGE_BPS: ${{ inputs.slippage_bps }}
      MIN_ALIGNED_COVERAGE: ${{ inputs.min_aligned_coverage }}
      LIVE_TRADING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Integrity tests
        run: pytest -q
      - name: Refuse missing CoinGlass secret
        shell: bash
        run: |
          if [ -z "$COINGLASS_API_KEY" ]; then
            echo 'Missing repository Actions secret: COINGLASS_API_KEY'
            exit 1
          fi
      - name: Run real-data backtest
        run: coinlab backtest --out artifacts/github_run
      - name: Upload reproducible report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coinlab-backtest-${{ github.run_id }}
          path: artifacts/github_run/
          if-no-files-found: warn
          retention-days: 30
